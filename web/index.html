<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHIP-8</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141414;
      --panel: #1f1f1f;
      --text: #dcdcdc;
      --muted: #8a8a8a;
      --accent: #ffd54f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 system-ui, sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
    canvas {
      width: 100%;
      aspect-ratio: 2 / 1;
      background: #202020;
      image-rendering: pixelated;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      background: var(--panel);
      padding: 10px 12px;
      border-radius: 6px;
    }
    .controls label { display: inline-flex; align-items: center; gap: 6px; }
    select, input[type="number"], button {
      font: inherit;
      color: var(--text);
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 4px 8px;
    }
    input[type="number"] { width: 5em; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .file input { display: none; }
    .file span {
      cursor: pointer;
      color: var(--text);
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      padding: 4px 8px;
    }
    #status {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: var(--muted);
      min-height: 1.4em;
      white-space: pre-wrap;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-width: 320px;
      touch-action: none;
      user-select: none;
    }
    .keypad button {
      font-size: 18px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.1;
    }
    .keypad button:active { background: var(--accent); color: #000; }
    .keypad small { font-size: 10px; color: var(--muted); }
    .keypad button:active small { color: #333; }
    .help { color: var(--muted); font-size: 13px; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>CHIP-8<span>TypeScript core, running in your browser</span></h1>
    <canvas id="screen" width="640" height="320"></canvas>
    <div class="controls">
      <label>ROM <select id="rom"></select></label>
      <label class="file"><span>Open .ch8</span><input id="file" type="file" accept=".ch8,application/octet-stream"></label>
      <label>Quirks
        <select id="quirks">
          <option value="chip8">CHIP-8 (COSMAC VIP)</option>
          <option value="schip">SUPER-CHIP</option>
        </select>
      </label>
      <label><input id="wrap" type="checkbox"> wrap sprites</label>
      <label>ipf <input id="ipf" type="number" min="1" max="5000" value="11"></label>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
      <label><input id="mute" type="checkbox"> mute</label>
    </div>
    <div id="status"></div>
    <div class="keypad" id="keypad"></div>
    <p class="help">Keys 1234 / QWER / ASDF / ZXCV are the CHIP-8 keypad. P pauses, Backspace resets, + and − change speed, M mutes. Drop a .ch8 file anywhere on the page to load it.</p>
  </main>
  <script type="module" src="./web.js"></script>
</body>
</html>
