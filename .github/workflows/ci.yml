name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: tests, types, browser bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun x tsc --noEmit -p tsconfig.json
      - run: bun run build:web
      - uses: actions/upload-artifact@v5
        with:
          name: web
          path: dist/web

  native:
    name: native build and verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: raylib build dependencies (X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - uses: actions/upload-artifact@v5
        with:
          name: chip8-${{ matrix.os }}
          path: |
            dist/chip8
            dist/chip8.exe
          if-no-files-found: error
